apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-app-stg-rollout
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/aki0000/sample-app-with-argocd.git
    targetRevision: main
    path: kustomize-rollout/overlays/stg
  destination:
    server: https://kubernetes.default.svc
    namespace: stg
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
